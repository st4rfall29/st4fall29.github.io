<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrator's Horrors</title>
<meta name="description" content="Тёмные истории, рассказанные при свете одного фонаря.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { ink: '#0c0c0d', bone: '#e8e1d2', ember: '#e9a54b', ash: '#8a857b' },
      fontFamily: { fell: ['"IM Fell English"', 'serif'], garamond: ['"Cormorant Garamond"', 'serif'] }
    } }
  }
</script>
<style>
  html, body { height: 100%; }
  body { background: #0c0c0d; overflow: hidden; }

  /* карта улиц (рисуется скриптом) */
  #map { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .5; filter: blur(.4px); }
  #map text { font-family: 'IM Fell English', serif; font-style: italic; fill: #8a857b; }

  /* туман */
  .fog { position: fixed; inset: -20%; pointer-events: none; mix-blend-mode: screen; will-change: transform; }
  .fog-a { background: radial-gradient(40% 35% at 30% 40%, rgba(150,150,150,.22), transparent 70%),
                       radial-gradient(35% 30% at 75% 65%, rgba(130,130,130,.2), transparent 70%);
           animation: drift-a 40s ease-in-out infinite alternate; }
  .fog-b { background: radial-gradient(45% 30% at 60% 25%, rgba(170,170,170,.16), transparent 70%),
                       radial-gradient(35% 35% at 20% 80%, rgba(140,140,140,.18), transparent 70%);
           animation: drift-b 55s ease-in-out infinite alternate; }
  @keyframes drift-a { to { transform: translate(7%, -4%) scale(1.15); } }
  @keyframes drift-b { to { transform: translate(-8%, 5%) scale(1.1); } }

  /* свет фонаря следует за курсором */
  .shade { position: fixed; inset: 0; pointer-events: none;
           background: radial-gradient(circle 38vmax at var(--x, 50%) var(--y, 45%), transparent 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.93) 100%); }
  .halo { position: absolute; left: 50%; top: 50%; width: 36rem; height: 36rem; max-width: 120vw;
          transform: translate(-50%, -50%); pointer-events: none;
          background: radial-gradient(circle, rgba(233,165,75,.18), rgba(232,225,210,.07) 40%, transparent 68%);
          animation: pulse 5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .65; transform: translate(-50%, -50%) scale(.94); } }

  /* зерно плёнки */
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .22; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* потёртый заголовок */
  .title { filter: url(#rough); text-shadow: 0 0 22px rgba(232,225,210,.25); line-height: .92; }
  .flicker { animation: flicker 7s linear infinite; }
  @keyframes flicker { 0%,100% { opacity: 1 } 92% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 96% { opacity: .7 } 97% { opacity: 1 } }

  .flame { transform-origin: 50% 100%; animation: flame 1.6s ease-in-out infinite alternate; }
  @keyframes flame { from { transform: scale(1, .92) skewX(-2deg); } to { transform: scale(.94, 1.06) skewX(2deg); } }
  .sway { transform-origin: 50% 0; animation: sway 6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }

  /* кнопка в виде рваной бумаги */
  .paper { position: relative; isolation: isolate; transition: transform .3s; }
  .paper::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
                   background: #e8e1d2; filter: url(#torn); transition: background .3s; }
  .door:hover .paper, .door:focus-visible .paper { transform: scale(1.04); }
  .door:hover .paper::before, .door:focus-visible .paper::before { background: #f6efdd; }
  .door:focus-visible { outline: 2px solid #e9a54b; outline-offset: 6px; border-radius: 999px; }

  /* вход на страницу — один выразительный момент */
  .rise { animation: rise 2.4s ease-out both; }
  @keyframes rise { from { opacity: 0; filter: blur(8px); } }

  @media (prefers-reduced-motion: reduce) {
    .fog, .halo, .flicker, .flame, .sway, .rise { animation: none !important; }
  }
</style>
</head>
<body class="font-garamond text-bone">

<!-- SVG-фильтры -->
<svg width="0" height="0" class="absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/></filter>
  <filter id="torn"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="9" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
</svg>

<svg id="map" aria-hidden="true"></svg>
<div class="fog fog-a"></div>
<div class="fog fog-b"></div>
<div class="shade" id="shade"></div>
<div class="grain"></div>

<main class="relative z-10 flex h-full flex-col items-center justify-center px-6 text-center rise">

  <div class="relative flex flex-col items-center">
    <div class="halo"></div>

    <!-- фонарь -->
    <svg class="sway relative w-16 sm:w-20" viewBox="0 0 80 130" aria-hidden="true">
      <path d="M40 2 L40 20" stroke="#6b665c" stroke-width="2"/>
      <circle cx="40" cy="6" r="4" fill="none" stroke="#6b665c" stroke-width="2"/>
      <path d="M22 28 L58 28 L52 18 L28 18 Z" fill="#26262a" stroke="#4a4740"/>
      <rect x="18" y="28" width="44" height="76" rx="3" fill="#18181b" stroke="#55524a" stroke-width="2"/>
      <rect x="25" y="36" width="30" height="58" rx="2" fill="#2b1e0e"/>
      <ellipse cx="40" cy="70" rx="14" ry="24" fill="rgba(233,165,75,.35)"/>
      <path class="flame" d="M40 86 C31 78 36 66 40 56 C44 66 49 78 40 86 Z" fill="#f5b85c"/>
      <path class="flame" d="M40 85 C36 80 38 74 40 69 C42 74 44 80 40 85 Z" fill="#fff0c4"/>
      <rect x="14" y="104" width="52" height="9" rx="2" fill="#26262a" stroke="#4a4740"/>
      <path d="M28 113 L52 113 L48 122 L32 122 Z" fill="#1e1e21"/>
    </svg>

    <!-- название -->
    <h1 class="title flicker relative mt-10 font-fell italic text-bone text-[clamp(3rem,10vw,7.5rem)]">
      Narrator’s<br><span class="ml-[.35em]">Horrors</span>
    </h1>

    <p class="relative mt-8 font-garamond text-lg italic font-semibold leading-snug text-bone/90 sm:text-2xl">
      Истории, которые не рассказывают при свете дня.<br>
      Жутко, медленно, затягивающе.
    </p>
  </div>

  <!-- вход -->
  <div class="mt-14 sm:mt-20">
    <p class="mb-3 text-base italic text-ash sm:text-lg">для интерактива haven of the moon flood</p>
    <p class="mb-4 text-lg italic font-semibold text-bone/80">Выберите, с чего начать</p>
    <a href="story.html" class="door group relative inline-block">
      <span class="paper flex items-center justify-between gap-10 rounded-full px-8 py-3 text-xl italic font-semibold text-ink sm:min-w-[22rem]">
        <span>Войти в историю</span>
        <span aria-hidden="true">›</span>
      </span>
    </a>
  </div>
</main>

<script>
  // Карта улиц на фоне — случайные линии и подписи
  (function () {
    const svg = document.getElementById('map');
    const W = 1600, H = 900, NS = 'http://www.w3.org/2000/svg';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const add = (tag, attrs, txt) => { const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt) e.textContent = txt; svg.appendChild(e); };

    for (let i = 0; i < 90; i++) {            // улицы
      let x = rnd() * W, y = rnd() * H, d = `M${x.toFixed(0)} ${y.toFixed(0)}`;
      let a = rnd() * Math.PI * 2;
      for (let s = 0; s < 4; s++) { a += (rnd() - .5) * .7; const l = 60 + rnd() * 170;
        x += Math.cos(a) * l; y += Math.sin(a) * l; d += ` L${x.toFixed(0)} ${y.toFixed(0)}`; }
      add('path', { d, stroke: '#6b665c', 'stroke-width': rnd() > .85 ? 1.6 : .6, fill: 'none', opacity: .8 });
    }
    // Река
    add('path', { d: 'M-20 640 C300 520 520 760 860 620 S1360 560 1640 660', stroke: '#4a4a4f', 'stroke-width': 26, fill: 'none', opacity: .55 });

    const names = ['Вороний переулок','Свечная улица','Старая бойня','Больница Св. Луки','Туманная набережная',
      'Кладбище Холлоу','Тупик Висельников','Площадь Тишины','Колокольный двор','Мост Отчаяния','Часовня','Угольные склады'];
    names.forEach(n => add('text', { x: 60 + rnd() * (W - 260), y: 60 + rnd() * (H - 120),
      'font-size': 15 + rnd() * 6, transform: `rotate(${(rnd() * 40 - 20).toFixed(0)})`, opacity: .85 }, n));
    ['ЗАБРОШЕННЫЙ', 'ВДОВИЙ ХОЛМ', 'ЗАТОН'].forEach(n => add('text', { x: 100 + rnd() * (W - 400), y: 100 + rnd() * (H - 200),
      'font-size': 22, 'letter-spacing': 6, opacity: .7 }, n));
  })();

  // Свет следует за курсором / пальцем
  const shade = document.getElementById('shade');
  const move = (x, y) => { shade.style.setProperty('--x', x + 'px'); shade.style.setProperty('--y', y + 'px'); };
  window.addEventListener('pointermove', e => move(e.clientX, e.clientY));
</script>
</body>
</html>
